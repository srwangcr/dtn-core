[package]
name = "dtn-core"
version = "0.1.0"
edition = "2021"
authors = ["Srwangcr/Jurgen Jesse Wang Rivera <srwangcr@gmail.com>"]
description = "High-Throughput Zero-Allocation BPv7 (DTN) Engine"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
portable-atomic = "1.10"

[target.'cfg(target_arch = "riscv32")'.dependencies]
portable-atomic = { version = "1.10", features = ["unsafe-assume-single-core"] }
riscv-rt = "0.13"

[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
criterion = "0.5"

[[bin]]
name = "dtn-cli"
path = "src/bin/dtn-cli.rs"

[[bin]]
name = "chaos_injector"
path = "src/bin/chaos_injector.rs"

[[bin]]
name = "dtnd"
path = "src/bin/dtnd.rs"

[[bench]]
name = "spsc_bench"
harness = false

[[bench]]
name = "pipeline_bench"
harness = false

[[bench]]
name = "e2e_daemon_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = true
